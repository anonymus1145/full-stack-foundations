name: Aida Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's own commit, not the merge commit checkout builds by default, so
          # a preview is of the branch as pushed.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the Aida CLI
        run: |
          npm config set @aida-cloud:registry https://gitlab.group.one/api/v4/packages/npm/
          npm config set //gitlab.group.one/api/v4/packages/npm/:_authToken "$AIDA_NPM_TOKEN"
          npm uninstall --global aida-cli && npm uninstall @aida-cloud/aida-cli 
          npm install --global @aida-cloud/aida-cli
          aida -V
        env:
          AIDA_NPM_TOKEN: ${{ secrets.AIDA_NPM_TOKEN }}

      - name: Deploy on staging
        run: aida deploy -e env_01m7m6f62p3zb5syfcz8ajhgs5
        env:
          AIDA_TOKEN: ${{ secrets.AIDA_TOKEN }}
