name: Aida Production

on:
  push:
    branches:
      - aida-base

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the Aida CLI
        run: npm uninstall --global aida-cli && npm install --global ./aida-cloud-aida-cli-0.0.1.tgz

      - name: Deploy to production
        run: aida deploy --production
        env:
          AIDA_TOKEN: ${{ secrets.AIDA_TOKEN }}
